[package]
name = "institution-conservation"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "The institution of exact conservation laws and finite traces"
license = "MIT"
repository = "https://github.com/ctoth/institution"
homepage = "https://github.com/ctoth/institution"
readme = "../README.md"
publish = true

[dependencies]
conservation-core = { version = "0.3.0", git = "https://github.com/ctoth/conservation.git", rev = "c2c9a44211d68d20d7a6d9a1d475c2e219cd7446" }
conservation-stock-flow = { version = "0.3.0", git = "https://github.com/ctoth/conservation.git", rev = "c2c9a44211d68d20d7a6d9a1d475c2e219cd7446" }
conservation-trace = { version = "0.3.0", git = "https://github.com/ctoth/conservation.git", rev = "c2c9a44211d68d20d7a6d9a1d475c2e219cd7446" }
institution = { version = "0.1.0", path = ".." }

[dev-dependencies]
conservation-bridgman = { git = "https://github.com/ctoth/conservation.git", rev = "c2c9a44211d68d20d7a6d9a1d475c2e219cd7446" }
conservation-dynamics = { version = "0.3.0", git = "https://github.com/ctoth/conservation.git", rev = "c2c9a44211d68d20d7a6d9a1d475c2e219cd7446" }
conservation-linear = { version = "0.3.0", git = "https://github.com/ctoth/conservation.git", rev = "c2c9a44211d68d20d7a6d9a1d475c2e219cd7446" }
num-bigint = "0.4"
num-rational = "0.4"
proptest = "1"
