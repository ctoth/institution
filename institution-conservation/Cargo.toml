[package]
name = "institution-conservation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The institution of exact conservation laws and finite traces"
license = "MIT"
repository = "https://github.com/ctoth/institution"
homepage = "https://github.com/ctoth/institution"
readme = "../README.md"
publish = true

[dependencies]
conservation-core = { version = "0.1.0", path = "../../conservation/conservation-core" }
conservation-stock-flow = { version = "0.1.0", path = "../../conservation/conservation-stock-flow" }
conservation-trace = { version = "0.1.0", path = "../../conservation/conservation-trace" }
institution = { version = "0.1.0", path = ".." }

[dev-dependencies]
conservation-dynamics = { version = "0.1.0", path = "../../conservation/conservation-dynamics" }
conservation-linear = { version = "0.1.0", path = "../../conservation/conservation-linear" }
num-bigint = "0.4"
num-rational = "0.4"
proptest = "1"
