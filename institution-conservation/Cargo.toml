[package]
name = "institution-conservation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The institution of exact conservation laws and finite traces"
license = "MIT"
repository = "https://github.com/ctoth/institution"
homepage = "https://github.com/ctoth/institution"
readme = "../README.md"
publish = true

[dependencies]
conservation-core = { version = "0.1.0", git = "https://github.com/ctoth/conservation.git", rev = "50f0364473053e8d9f381d53884dcc72cbb2862c" }
conservation-stock-flow = { version = "0.1.0", git = "https://github.com/ctoth/conservation.git", rev = "50f0364473053e8d9f381d53884dcc72cbb2862c" }
conservation-trace = { version = "0.1.0", git = "https://github.com/ctoth/conservation.git", rev = "50f0364473053e8d9f381d53884dcc72cbb2862c" }
institution = { version = "0.1.0", path = ".." }

[dev-dependencies]
conservation-dynamics = { version = "0.1.0", git = "https://github.com/ctoth/conservation.git", rev = "50f0364473053e8d9f381d53884dcc72cbb2862c" }
conservation-linear = { version = "0.1.0", git = "https://github.com/ctoth/conservation.git", rev = "50f0364473053e8d9f381d53884dcc72cbb2862c" }
num-bigint = "0.4"
num-rational = "0.4"
proptest = "1"
